<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Linha Editora — Filme</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Spectral:ital,wght@0,300;1,300&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy:   #001F3F;
    --silver: #A8A9AD;
    --white:  #F8F8F8;
    --muted:  #8E98A8; /* prata sobre marinho (versão negativa) */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }

  #stage { position: relative; background: var(--white); overflow: hidden; transform-origin: center center; flex: none; }
  .layer { position: absolute; inset: 0; }
  svg.layer { overflow: visible; }

  /* ---------- Take 1: o texto ---------- */
  #para {
    position: absolute;
    font-family: 'Spectral', serif; font-weight: 300;
    color: var(--navy); line-height: 1.38;
  }
  #para .ch { opacity: 0; }
  #para .it { font-style: italic; }
  [data-f="h"] #para { font-size: 66px; width: 1240px; }
  [data-f="v"] #para { font-size: 64px; width: 880px; }
  [data-f="s"] #para { font-size: 54px; width: 880px; }

  /* ---------- Legendas ---------- */
  .cap { position: absolute; opacity: 0; }
  .kicker {
    font-family: 'IBM Plex Mono', monospace; font-size: 18px; letter-spacing: 6px;
    text-transform: uppercase; margin-bottom: 22px;
  }
  .phrase { font-family: 'Jost', sans-serif; font-weight: 300; line-height: 1.08; letter-spacing: -.5px; }
  .phrase .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .14em; margin-bottom: -.14em; }
  .phrase .w > span { display: inline-block; transform: translateY(110%); }
  #cap2 { color: var(--navy); }  #cap2 .kicker { color: var(--silver); }
  #cap3 { color: var(--white); } #cap3 .kicker { color: var(--muted); }
  [data-f="h"] .cap { left: 140px; top: 170px; } [data-f="h"] .phrase { font-size: 76px; }
  [data-f="v"] .cap { left: 90px; top: 250px; width: 900px; } [data-f="v"] .phrase { font-size: 84px; }
  [data-f="s"] .cap { left: 90px; top: 120px; width: 900px; } [data-f="s"] .phrase { font-size: 60px; }

  /* ---------- Assinatura ---------- */
  #lockup { position: absolute; display: flex; align-items: flex-end; }
  [data-f="h"] #lockup { flex-direction: row; gap: 196px; }
  [data-f="v"] #lockup { flex-direction: column; align-items: center; gap: 120px; }
  [data-f="s"] #lockup { flex-direction: column; align-items: center; gap: 84px; }
  .wordmark { display: flex; flex-direction: column; align-items: flex-end; color: var(--white); }
  [data-f="v"] .wordmark, [data-f="s"] .wordmark { align-items: center; }
  .w-linha { font-family: 'Jost', sans-serif; font-weight: 300; line-height: .74; letter-spacing: -2px; display: flex; }
  .w-linha span { display: inline-block; opacity: 0; }
  .w-editora { font-family: 'Jost', sans-serif; font-weight: 300; line-height: 1; white-space: nowrap; opacity: 0; }
  [data-f="h"] .w-linha { font-size: 300px; } [data-f="h"] .w-editora { font-size: 96px; margin: 6px 4px 0 0; }
  [data-f="v"] .w-linha { font-size: 190px; } [data-f="v"] .w-editora { font-size: 60px; margin-top: 2px; }
  [data-f="s"] .w-linha { font-size: 150px; } [data-f="s"] .w-editora { font-size: 48px; margin-top: 2px; }

  /* ---------- Encerramento ---------- */
  #tagline {
    position: absolute; left: 0; right: 0; text-align: center;
    font-family: 'Jost', sans-serif; font-weight: 300; color: var(--white); line-height: 1.16;
  }
  #tagline .ln { display: block; overflow: hidden; padding-bottom: .1em; margin-bottom: -.1em; }
  #tagline .ln > span { display: inline-block; transform: translateY(110%); }
  [data-f="h"] #tagline { font-size: 64px; }
  [data-f="v"] #tagline { font-size: 72px; }
  [data-f="s"] #tagline { font-size: 52px; }

  /* ---------- Cabeçalhos editoriais (como as páginas do manual) ---------- */
  .hdr {
    position: absolute; font-family: 'IBM Plex Mono', monospace; font-size: 18px;
    letter-spacing: 5px; text-transform: uppercase; white-space: nowrap;
  }
  [data-f="h"] .hdr { top: 76px; } [data-f="v"] .hdr { top: 110px; } [data-f="s"] .hdr { top: 64px; }
  #hdrL { left: 80px; } #hdrR { right: 80px; }
  #footer { top: auto !important; left: 0; right: 0; text-align: center; color: var(--muted); opacity: 0; }
  [data-f="h"] #footer { bottom: 76px; } [data-f="v"] #footer { bottom: 150px; } [data-f="s"] #footer { bottom: 64px; }

  /* ---------- Player ---------- */
  #ui {
    position: fixed; bottom: 16px; right: 16px; display: flex; gap: 8px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 2px;
  }
  #ui a, #ui button {
    color: #8E98A8; background: #001F3F; border: 1px solid rgba(168,169,173,.3);
    padding: 7px 12px; text-decoration: none; cursor: pointer; font: inherit; text-transform: uppercase;
  }
  #ui a.on { color: #F8F8F8; border-color: rgba(248,248,248,.6); }
  body.export #ui { display: none; }
</style>
</head>
<body>

<div id="stage">
  <svg class="layer" id="bg"></svg>
  <div id="para"></div>
  <svg class="layer" id="fx"></svg>

  <div class="cap" id="cap2">
    <div class="kicker">A linha é —</div>
    <div class="phrase">o fio da narrativa.</div>
  </div>
  <div class="cap" id="cap3">
    <div class="kicker">A linha é —</div>
    <div class="phrase">a lombada que alinha os livros na estante.</div>
  </div>

  <div id="lockup">
    <div id="symph"></div>
    <div class="wordmark">
      <div class="w-linha"><span>L</span><span>i</span><span>n</span><span>h</span><span>a</span></div>
      <div class="w-editora">editora</div>
    </div>
  </div>

  <div id="tagline">
    <span class="ln"><span>Toda história começa</span></span>
    <span class="ln"><span>por uma linha.</span></span>
  </div>

  <div class="hdr" id="hdrL">Linha Editora</div>
  <div class="hdr" id="hdrR"></div>
  <div class="hdr" id="footer">linhaeditora.com.br</div>
</div>

<div id="ui">
  <a href="?f=h" data-f="h">16:9</a>
  <a href="?f=v" data-f="v">9:16</a>
  <a href="?f=s" data-f="s">1:1</a>
  <button id="replay">↺ Repetir</button>
</div>

<script>
/* =========================================================
   Formato e palco
   ========================================================= */
const params = new URLSearchParams(location.search);
const FORMATS = { h: [1920, 1080], v: [1080, 1920], s: [1080, 1080] };
const F = FORMATS[params.get('f')] ? params.get('f') : 'h';
const [W, H] = FORMATS[F];
const U = Math.min(W, H) * 0.9;
const stage = document.getElementById('stage');
stage.dataset.f = F;
stage.style.width = W + 'px';
stage.style.height = H + 'px';
if (params.has('export')) document.body.classList.add('export');
document.querySelectorAll('#ui a').forEach(a => a.classList.toggle('on', a.dataset.f === F));
const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / W, innerHeight / H)})`; };
addEventListener('resize', fit); fit();

/* =========================================================
   Easing e utilidades
   ========================================================= */
const clamp = v => Math.max(0, Math.min(1, v));
const prog  = (t, a, d) => clamp((t - a) / d);
const lerp  = (a, b, m) => a + (b - a) * m;
const outCubic   = x => 1 - Math.pow(1 - x, 3);
const inCubic    = x => x * x * x;
const outExpo    = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
const inOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const invInOutCubic = y => y < .5 ? Math.cbrt(y / 4) : 1 - Math.cbrt(2 * (1 - y)) / 2;
const outBack    = (x, s = 1.2) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const NS = 'http://www.w3.org/2000/svg';
const svgEl = (parent, tag, attrs = {}) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
};
const setLine = (e, x1, y1, x2, y2) => {
  e.setAttribute('x1', x1); e.setAttribute('y1', y1);
  e.setAttribute('x2', x2); e.setAttribute('y2', y2);
};

/* =========================================================
   Símbolo (coordenadas do brandbook, base comum em y=228)
   ========================================================= */
const BASE = 228, SYM_TOP = 5, SYM_CX = 135.5, SYM_CY = 116.5;
const SPINES = [
  [4, 8, 'w'], [25, 23, 'g'], [45, 5, 'w'], [66, 50, 'g'], [86, 5, 'w'],
  [107, 96, 'g'], [125, 96, 'g'], [145, 5, 'w'], [166, 31, 'g'],
];
const LEANERS = [[196, 219, 8.9, 'w'], [214, 213, 15.8, 'g']];
const COLOR = { w: 'var(--white)', g: 'var(--muted)' };
const GRID = 20.25; // passo das lombadas na malha

const CFG = {
  h: { scL: .86, scE: .85, x0: 64 },
  v: { scL: 1.6, scE: .95, x0: 54 },
  s: { scL: 1.2, scE: .7,  x0: 54 },
}[F];

/* =========================================================
   Montagem do DOM
   ========================================================= */
const PARA = 'A linha é o traço do texto, o fio da narrativa e a lombada que alinha os livros na estante.';
const para = document.getElementById('para');
para.innerHTML = [...PARA].map((ch, i) =>
  `<span class="ch${i >= 2 && i < 7 ? ' it' : ''}">${ch}</span>`).join('');
const chars = [...para.querySelectorAll('.ch')];

document.querySelectorAll('.phrase').forEach(p => {
  p.innerHTML = p.textContent.split(' ').map(w => `<span class="w"><span>${w}</span></span>`).join(' ');
});

const bg = document.getElementById('bg');
const fx = document.getElementById('fx');
const lockup  = document.getElementById('lockup');
const symph   = document.getElementById('symph');
const letters = [...document.querySelectorAll('.w-linha span')];
const editora = document.querySelector('.w-editora');
const tagline = document.getElementById('tagline');
const tagLines = [...tagline.querySelectorAll('.ln > span')];
const cap2 = document.getElementById('cap2'), cap3 = document.getElementById('cap3');
const hdrL = document.getElementById('hdrL'), hdrR = document.getElementById('hdrR');
const footer = document.getElementById('footer');

/* =========================================================
   Layout — mede tudo uma vez, depois do carregamento das fontes
   ========================================================= */
let L = {}; // geometria calculada

function layout() {
  const sR = stage.getBoundingClientRect(), k = sR.width / W;
  const rel = el => {
    const r = el.getBoundingClientRect();
    return { x: (r.left - sR.left) / k, y: (r.top - sR.top) / k, w: r.width / k, h: r.height / k };
  };

  // Parágrafo centralizado
  para.style.left = (W - para.offsetWidth) / 2 + 'px';
  para.style.top  = (H - para.offsetHeight) / 2 + 'px';
  const fs = parseFloat(getComputedStyle(para).fontSize);
  const cr = chars.map(rel);
  const lines = [];
  cr.forEach((r, i) => {
    if (PARA[i] === ' ') return;
    let ln = lines.find(l => Math.abs(l.top - r.y) < 6);
    if (!ln) lines.push(ln = { top: r.y, l: r.x, r: r.x + r.w, h: r.h });
    ln.l = Math.min(ln.l, r.x); ln.r = Math.max(ln.r, r.x + r.w);
  });
  lines.forEach(l => l.y = l.top + l.h * .64);
  const cy = lines.reduce((s, l) => s + l.y, 0) / lines.length;
  const minL = Math.min(...lines.map(l => l.l));
  L.chars = cr; L.lines = lines; L.cy = cy; L.minL = minL; L.fs = fs;

  // Assinatura (posição final da etapa 5)
  symph.style.width  = 288 * CFG.scL + 'px';
  symph.style.height = 240 * CFG.scL + 'px';
  lockup.style.left = (W - lockup.offsetWidth) / 2 + 'px';
  lockup.style.top  = (H - lockup.offsetHeight) / 2 + (F === 'h' ? -10 : F === 'v' ? -60 : -40) + 'px';
  const ph = rel(symph);
  L.lock = { ox: ph.x + 4 * CFG.scL, oy: ph.y + 4 * CFG.scL, sc: CFG.scL };
  L.cen  = { ox: W / 2 - SYM_CX * CFG.scL, oy: H / 2 - SYM_CY * CFG.scL - (F === 'h' ? 10 : 30), sc: CFG.scL };

  // Encerramento: símbolo + frase, centralizados como na última página do manual
  const scE = CFG.scE, symH = (BASE - SYM_TOP) * scE, gap = symH * .42;
  const th = tagline.offsetHeight;
  const top = (H - (symH + gap + th)) / 2 - 10;
  L.end = { ox: W / 2 - SYM_CX * scE, oy: top - SYM_TOP * scE, sc: scE };
  tagline.style.top = top + symH + gap + 'px';

  // Fio da narrativa: um único path; a "janela" visível percorre o caminho
  const x0 = CFG.x0;
  const win = Math.max(H + 160, 600);
  const R = Math.min(Math.max(...lines.map(l => l.r)), W - .3 * U);
  const L0 = R - win;
  const yb = H / 2 + win / 2;
  const c = cy, u = U;
  const d = [
    `M ${L0} ${c} H ${R}`,
    `C ${R + .18 * u} ${c}, ${R + .2 * u} ${c - .28 * u}, ${R + .06 * u} ${c - .28 * u}`,
    `C ${R - .08 * u} ${c - .28 * u}, ${R - .06 * u} ${c + .02 * u}, ${R + .1 * u} ${c + .1 * u}`,
    `C ${R + .3 * u} ${c + .2 * u}, ${R + .12 * u} ${H + .12 * u}, ${W * .45} ${H + .12 * u}`,
    `C ${x0 + .2 * u} ${H + .12 * u}, ${x0} ${yb + .15 * u}, ${x0} ${yb}`,
    `L ${x0} ${yb - win}`,
  ].join(' ');
  L.R = R; L.L0 = L0; L.win = win; L.x0 = x0; L.yb = yb;

  // ---------- Elementos SVG ----------
  bg.innerHTML = ''; fx.innerHTML = '';
  L.fill = svgEl(bg, 'rect', { x: 0, y: -10, height: H + 20, width: 0, fill: 'var(--navy)' });

  const stroke = 3;
  L.strikes = lines.map(() => svgEl(fx, 'line', { stroke: 'var(--navy)', 'stroke-width': stroke, 'stroke-linecap': 'round' }));
  L.caret = svgEl(fx, 'line', { stroke: 'var(--navy)', 'stroke-width': 3, 'stroke-linecap': 'round' });
  L.thread = svgEl(fx, 'path', { d, fill: 'none', stroke: 'var(--navy)', 'stroke-width': stroke, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  L.total = L.thread.getTotalLength();
  L.thread.setAttribute('stroke-dasharray', `${win} ${L.total + win}`);
  L.sweep = svgEl(fx, 'line', { stroke: 'var(--navy)', 'stroke-width': stroke });

  // Estante: lombadas na mesma malha do símbolo, base comum
  seed = 7;
  const C = L.cen;
  const kMin = Math.floor((-20 - C.ox) / (GRID * C.sc)), kMax = Math.ceil((W + 20 - C.ox) / (GRID * C.sc));
  L.shelf = [];
  for (let kk = kMin; kk <= kMax; kk++) {
    const x = C.ox + (4 + GRID * kk) * C.sc;
    const spine = kk >= 0 && kk < 9 ? kk : -1;
    const col = spine >= 0 ? SPINES[spine][2] : (rand() < .45 ? 'w' : 'g');
    // alturas nos mesmos níveis do símbolo, para ler como livros e não como onda
    const LEVELS = [1, 1, .93, .87, .79, .6];
    const h = LEVELS[Math.floor(rand() * LEVELS.length)] * (BASE - SYM_TOP) * C.sc;
    const el = svgEl(fx, 'line', { stroke: COLOR[col], 'stroke-linecap': 'round' });
    L.shelf.push({ x, h, spine, el, dist: Math.abs(x - W / 2) });
  }
  L.maxDist = Math.max(...L.shelf.map(s => s.dist));
  L.leaners = LEANERS.map(lg => svgEl(fx, 'line', { stroke: COLOR[lg[3]], 'stroke-linecap': 'round' }));
}

/* =========================================================
   Linha do tempo (segundos)
   ---------------------------------------------------------
   0.0  Take 1 — o texto é escrito
   2.7  as linhas de texto viram traços e se fundem numa só
   4.8  Take 2 — o fio da narrativa percorre a tela
   7.5  Take 3 — o fio vira cortina: a tela fica marinho e
        deixa para trás uma estante de lombadas
   9.7  Take 4 — a estante se reduz ao símbolo
   11.9 Take 5 — assinatura horizontal
   14.6 Take 6 — encerramento "Toda história começa por uma linha."
   ========================================================= */
const DURATION = 18;
const SW_T = 7.5, SW_D = 2.1;

function symPose(t) {
  const m5 = inOutCubic(prog(t, 11.9, 1.0));
  const m6 = inOutCubic(prog(t, 14.7, 1.15));
  const mix = (a, b, m) => ({ ox: lerp(a.ox, b.ox, m), oy: lerp(a.oy, b.oy, m), sc: lerp(a.sc, b.sc, m) });
  return mix(mix(L.cen, L.lock, m5), L.end, m6);
}

function chapter(t) {
  const marks = [[0, '01 — O texto'], [4.75, '02 — A narrativa'], [SW_T + .4, '03 — A estante'], [11.6, ''], [15.2, 'Fim']];
  let label = '', tc = -9;
  for (const [mt, lb] of marks) if (t >= mt) { label = lb; tc = mt; }
  const next = marks.find(m => m[0] > t);
  const op = Math.min(clamp((t - tc) / .3), next ? clamp((next[0] - t) / .2) : 1);
  return [label, op];
}

function render(t) {
  const { x0, win } = L;

  /* ----- Fundo: cortina marinho que acompanha a varredura ----- */
  const sw = inOutCubic(prog(t, SW_T, SW_D));
  const sweepX = lerp(x0, W + 40, sw);
  const fillLeft = x0 * (1 - sw);
  L.fill.setAttribute('x', fillLeft);
  L.fill.setAttribute('width', t >= SW_T ? Math.max(0, sweepX - fillLeft) : 0);

  /* ----- Take 1: digitação ----- */
  const n = prog(t, .35, 2.1) * chars.length;
  const paraOp = 1 - outCubic(prog(t, 3.2, .45));
  chars.forEach((c, i) => { c.style.opacity = clamp(n - i) * paraOp; });
  // cursor: a primeira "linha" do filme
  const ci = Math.min(chars.length - 1, Math.max(0, Math.ceil(n) - 1));
  const cr = L.chars[ci];
  const caretOn = t > .2 && t < 2.9 && (t < 2.45 || Math.floor((t - 2.45) / .22) % 2 === 1);
  setLine(L.caret, cr.x + cr.w + 6, cr.y + cr.h * .2, cr.x + cr.w + 6, cr.y + cr.h * .86);
  L.caret.style.opacity = caretOn ? 1 : 0;

  /* ----- Traços sobre o texto, que convergem numa linha só ----- */
  const merge = inOutCubic(prog(t, 3.55, .75));
  const extend = inOutCubic(prog(t, 4.3, .45));
  L.lines.forEach((ln, j) => {
    const dr = outCubic(prog(t, 2.7 + j * .1, .55));
    const y = lerp(ln.y, L.cy, merge);
    const xa = lerp(lerp(ln.l, L.minL, merge), L.L0, extend);
    const xb = lerp(ln.r, L.R, merge);
    setLine(L.strikes[j], xa, y, lerp(xa, xb, dr), y);
    L.strikes[j].style.opacity = dr > 0 && t < 4.75 ? 1 : 0;
  });

  /* ----- Take 2: o fio ----- */
  const th = inOutCubic(prog(t, 4.75, 2.7));
  L.thread.setAttribute('stroke-dashoffset', -th * (L.total - win));
  L.thread.style.opacity = t >= 4.75 && t < SW_T ? 1 : 0;

  /* ----- Take 3: a varredura ----- */
  setLine(L.sweep, sweepX, L.yb, sweepX, L.yb - win);
  L.sweep.style.opacity = t >= SW_T && sw < 1 ? 1 : 0;

  /* ----- Estante → símbolo ----- */
  const P = symPose(t);
  const m4 = inOutCubic(prog(t, 10.05, .85));
  const shelfBase = L.cen.oy + BASE * L.cen.sc;
  L.shelf.forEach(s => {
    const pass = s.x <= x0 ? SW_T + .05 : SW_T + SW_D * invInOutCubic(clamp((s.x - x0) / (W + 40 - x0)));
    const grow = outExpo(prog(t, pass, .6));
    let x1 = s.x, yB = shelfBase, yT = shelfBase - s.h * grow, w = 3.2 * L.cen.sc, op = grow > 0 ? 1 : 0;
    if (s.spine < 0) {
      // lombadas extras descem para a base, das bordas para o centro
      const delay = (s.dist / L.maxDist) * -.55 + .55;
      const q = inCubic(prog(t, 9.7 + (.55 - delay), .6));
      yT = lerp(yT, yB, q);
      op *= 1 - q;
    } else {
      const [sx, stop] = SPINES[s.spine];
      const tx = P.ox + sx * P.sc, tb = P.oy + BASE * P.sc, tt = P.oy + stop * P.sc;
      x1 = lerp(s.x, tx, m4); yB = lerp(yB, tb, m4); yT = lerp(yT, tt, m4);
      w = lerp(w, 8 * P.sc, m4);
    }
    setLine(s.el, x1, yB, x1, yT);
    s.el.setAttribute('stroke-width', w);
    s.el.style.opacity = op;
  });

  // as duas peças inclinadas: sobem retas e se deitam — o gesto de quem guardou um livro
  LEANERS.forEach(([bx, len, ang], i) => {
    const grow = outExpo(prog(t, 10.55 + i * .1, .7));
    const lean = outBack(prog(t, 11.1 + i * .16, .75));
    const a = ang * lean * Math.PI / 180, Ln = len * grow * P.sc;
    const x = P.ox + bx * P.sc, y = P.oy + BASE * P.sc;
    setLine(L.leaners[i], x, y, x + Math.sin(a) * Ln, y - Math.cos(a) * Ln);
    L.leaners[i].setAttribute('stroke-width', 8 * P.sc);
    L.leaners[i].style.opacity = grow > 0 ? 1 : 0;
  });

  /* ----- Legendas ----- */
  const caption = (el, tIn, tOut) => {
    const out = outCubic(prog(t, tOut, .45));
    el.style.opacity = (t >= tIn ? 1 : 0) * (1 - out);
    el.style.transform = `translateY(${-out * 14}px)`;
    el.querySelector('.kicker').style.opacity = outCubic(prog(t, tIn, .5));
    el.querySelectorAll('.w > span').forEach((w, i) => {
      const p = outCubic(prog(t, tIn + .15 + i * .07, .7));
      w.style.transform = `translateY(${(1 - p) * 110}%)`;
    });
  };
  caption(cap2, 5.15, 7.0);
  caption(cap3, 8.3, 9.6);

  /* ----- Take 5: assinatura ----- */
  const wOut = prog(t, 14.55, .5);
  letters.forEach((el, i) => {
    const p = outCubic(prog(t, 12.35 + i * .07, .8));
    const o = outCubic(clamp(wOut * 1.6 - (4 - i) * .12));
    el.style.opacity = p * (1 - o);
    el.style.transform = `translateY(${(1 - p) * 34 - o * 18}px)`;
  });
  const e = outCubic(prog(t, 12.85, 1.0));
  editora.style.opacity = e * (1 - outCubic(wOut));
  editora.style.letterSpacing = (0.06 + (1 - e) * 0.32) + 'em';

  /* ----- Take 6: encerramento ----- */
  tagLines.forEach((el, i) => {
    const p = outCubic(prog(t, 15.35 + i * .16, .95));
    el.style.transform = `translateY(${(1 - p) * 110}%)`;
  });
  footer.style.opacity = outCubic(prog(t, 16.2, .8));

  /* ----- Cabeçalhos: mudam de cor quando a cortina passa ----- */
  const onNavy = el => {
    const x = el.offsetLeft, r = x + el.offsetWidth;
    return t >= SW_T && fillLeft <= x && sweepX >= r;
  };
  hdrL.style.color = onNavy(hdrL) ? 'var(--muted)' : 'var(--navy)';
  hdrR.style.color = onNavy(hdrR) ? 'var(--muted)' : 'var(--silver)';
  hdrL.style.opacity = outCubic(prog(t, .1, .6)) * (1 - outCubic(prog(t, 11.4, .5))) + outCubic(prog(t, 15.0, .6));
  const [lab, op] = chapter(t);
  hdrR.textContent = lab;
  hdrR.style.opacity = op * outCubic(prog(t, .1, .6));
}

/* =========================================================
   Player e exportação
   ========================================================= */
let start = null, stopped = false;
function loop(now) {
  if (stopped) return;
  if (start === null) start = now;
  const t = (now - start) / 1000;
  render(Math.min(t, DURATION));
  if (t > DURATION + 1) start = now;
  requestAnimationFrame(loop);
}
document.getElementById('replay').onclick = () => { start = null; };
window.__duration = DURATION;
window.__seek = t => { stopped = true; render(t); };

document.fonts.ready.then(() => {
  layout();
  render(0);
  window.__ready = true;
  if (!params.has('export')) requestAnimationFrame(loop);
});
</script>
