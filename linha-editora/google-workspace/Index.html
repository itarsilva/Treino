<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Linha Editora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral fixa com as áreas da editora; conteúdo à direita. No celular, a barra vira abas roláveis no topo. */
:root {
  --bg: #F3F5F3; --surface: #FFFFFF; --ink: #16211D; --muted: #5D6B66; --line: #DCE3DF;
  --accent: #1F6B53; --accent-ink: #FFFFFF; --accent-soft: #E1EEE8; --chip: #ECF0EE;
  --warn: #8F5600; --warn-soft: #FBEED6; --bad: #A8241C; --bad-soft: #F8E0DD; --good: #256B43; --good-soft: #DFF0E5;
  --shadow: 0 10px 30px rgba(22, 33, 29, .14);
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1513; --surface: #161E1B; --ink: #E4ECE8; --muted: #93A39C; --line: #27332F;
  --accent: #5DBF9A; --accent-ink: #0B1411; --accent-soft: #1A2D26; --chip: #1F2926;
  --warn: #E5AA55; --warn-soft: #33291A; --bad: #F08B81; --bad-soft: #3A201D; --good: #7CCB9A; --good-soft: #1A2E22;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F1513; --surface: #161E1B; --ink: #E4ECE8; --muted: #93A39C; --line: #27332F;
  --accent: #5DBF9A; --accent-ink: #0B1411; --accent-soft: #1A2D26; --chip: #1F2926;
  --warn: #E5AA55; --warn-soft: #33291A; --bad: #F08B81; --bad-soft: #3A201D; --good: #7CCB9A; --good-soft: #1A2E22;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding-block: 24px; padding-inline: 16px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 20px; }
.brand { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; padding-inline: 8px; }
.brand::after { content: ""; display: block; height: 2px; width: 100%; margin-top: 10px; background: linear-gradient(90deg, var(--accent) 0 38%, var(--line) 38%); }
.brand small { display: block; font: 500 10px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
nav { display: flex; flex-direction: column; gap: 2px; }
.navgroup { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; }
nav button { all: unset; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 6px; color: var(--ink); }
nav button:hover { background: var(--chip); }
nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav button .n { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
nav button:focus-visible { outline: 2px solid var(--accent); }
.side .foot { margin-top: auto; font-size: 11px; color: var(--muted); padding-inline: 10px; }

main { padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
h1 { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
h2 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 0; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; width: 220px; max-width: 100%; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
a.btn { color: var(--ink); text-decoration: none; display: inline-block; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 12px; }

.banner { border: 1px solid var(--line); background: var(--warn-soft); color: var(--ink); border-radius: 8px; padding: 10px 14px; }
.banner[hidden] { display: none; }

/* Painel */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.kpi { background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.kpi .l { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.kpi .v { font: 600 24px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.kpi .h { font-size: 12px; color: var(--muted); }
.kpi .v.bad { color: var(--bad); } .kpi .v.good { color: var(--good); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 130px minmax(0, 1fr) 110px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 10px; background: var(--chip); border-radius: 5px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 5px; }
.bar .amt { text-align: right; font: 12px var(--mono); font-variant-numeric: tabular-nums; }
.list { display: flex; flex-direction: column; }
.list .it { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
.list .it:first-child { border-top: 0; }
.list .it .t { min-width: 0; }
.list .it .t b { font-weight: 600; }
.list .it .t div { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); padding: 8px 0; }

/* Tabelas */
.tablebox { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--chip); }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12px; }
td.txt { min-width: 180px; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.ex { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--warn); margin-left: 6px; }
.tfoot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 12px; }
.blank { text-align: center; padding: 40px 20px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.blank b { color: var(--ink); font-family: var(--display); font-size: 17px; font-weight: 600; }

/* Funil */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--chip); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.col header { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 4px 6px; }
.col header b { font-weight: 600; font-size: 13px; }
.col header span { font: 11px var(--mono); color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
.card:hover { border-color: var(--muted); }
.card .who { font-size: 12px; color: var(--muted); }
.card .what { font-weight: 600; line-height: 1.3; }
.card .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.card .val { font: 500 13px var(--mono); }
.card select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 6px; font-size: 12px; width: 100%; }

/* Formulário */
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow-y: auto; overscroll-behavior: contain; }
dialog::backdrop { background: rgba(10, 16, 14, .45); }
dialog form { display: block; }
.dh { padding: 18px 22px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 2; background: var(--surface); padding-bottom: 6px; }
.db { padding: 16px 22px; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.df { padding: 14px 22px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; position: sticky; bottom: 0; z-index: 2; background: var(--surface); }
.df .r { display: flex; gap: 8px; margin-left: auto; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f.full { grid-column: 1 / -1; }
.f label { font-size: 12px; color: var(--muted); font-weight: 500; }
.f input, .f select, .f textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 8px 10px; width: 100%; }
.f textarea { min-height: 72px; resize: vertical; }
.f .hint { font-size: 11px; color: var(--muted); }
.x { all: unset; cursor: pointer; font-size: 22px; line-height: 1; color: var(--muted); padding: 4px; }
.sec { grid-column: 1 / -1; margin: 8px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font: 600 11px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
table.equipe td { vertical-align: middle; }
table.equipe select, table.equipe input { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 7px; font-size: 12px; max-width: 100%; }
[hidden] { display: none !important; }
body { margin: 0; }
.socios { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.socio { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.socio .l { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.socio .v { font: 600 24px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.socio .h { font-size: 12px; color: var(--muted); }
.socio .track { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.socio .fill { height: 100%; background: var(--accent); border-radius: 4px; }
.socio.outro .fill { background: var(--muted); }
.filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: -6px; }
.filtros select, .filtros input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 13px; max-width: 100%; }
.filtros select.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.filtros .fl { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.filtros .fchk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.filtros .fchk.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.err { color: var(--bad); font-size: 12px; grid-column: 1 / -1; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow); font-size: 13px; z-index: 50; }

@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 12px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 8px; }
  .brand { font-size: 18px; padding: 0; } .brand small { display: none; } .brand::after { margin-top: 6px; }
  nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .navgroup, .side .foot, nav button .n { display: none; }
  nav button { white-space: nowrap; padding: 6px 10px; }
  main { padding-block: 18px 48px; }
  .wrap { padding-inline: 0; }
  h1 { font-size: 24px; }
  .db { grid-template-columns: minmax(0, 1fr); }
  .bar { grid-template-columns: 100px minmax(0, 1fr) 92px; }
}
@media (prefers-reduced-motion: no-preference) { .card, .btn, nav button { transition: background .15s, border-color .15s; } }
</style>

</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Linha Editora<small>Gestão editorial &amp; CRM</small></div>
    <nav id="nav" aria-label="Áreas"></nav>
    <div class="foot" id="who">Dados compartilhados com a equipe</div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>

<dialog id="dlg"><form id="frm" method="dialog" novalidate></form></dialog>
<div class="toast" id="toast" hidden></div>

<script>
// ---------- Configuração ----------
const L = {
  genero: ["Romance", "Contos", "Poesia", "Não-ficção", "Biografia", "Infantil", "Juvenil", "Ensaio", "Técnico", "HQ"],
  formato: ["Brochura", "Capa dura", "E-book", "Audiolivro", "Box"],
  statusTitulo: ["Em avaliação", "Contratado", "Em produção", "Pré-venda", "Publicado", "Esgotado", "Fora de catálogo"],
  etapa: ["Recebimento de original", "Leitura crítica", "Edição", "Preparação de texto", "Revisão", "Diagramação", "Capa", "Prova gráfica", "ISBN/Ficha catalográfica", "Gráfica", "Distribuição"],
  statusTarefa: ["Não iniciado", "Em andamento", "Aguardando", "Concluído"],
  tipoContato: ["Livraria", "Distribuidora", "Marketplace", "Escola/Governo", "Imprensa", "Influenciador", "Evento/Feira", "Leitor", "Fornecedor", "Autor prospect"],
  canal: ["Site próprio", "Amazon", "Livrarias", "Distribuidora", "Feiras/Eventos", "Venda direta", "Governo/Escolas", "E-book"],
  origem: ["Indicação", "Instagram", "Site", "Feira", "Prospecção ativa", "E-mail", "Evento"],
  tipoInteracao: ["Ligação", "E-mail", "WhatsApp", "Reunião", "Visita", "Envio de amostra", "Proposta"],
  tipoFin: ["Receita", "Despesa"],
  categoria: ["Venda de livros", "Direitos/Licenciamento", "Edital/Incentivo", "Livro (produção)", "Gráfica", "Revisão/Edição", "Diagramação/Capa", "Serviço", "Royalties", "Marketing", "Comunicação", "Tecnologia", "Contabilidade", "CNPJ/Registros", "Financeiro", "Operacional", "Produto", "Frete/Correios", "Eventos", "Impostos/Tributos"],
  mov: ["Venda", "Consignação", "Acerto de consignação", "Devolução de consignação", "Doação", "Divulgação", "Direitos autorais"],
  entrega: ["Pendente", "Enviado", "Entregue"],
  simnao: ["Sim", "Não"],
  pagoPor: ["Marcelo", "Adauto", "Conta da editora", "Outro"],
  pagamento: ["Pix", "Boleto", "Transferência", "Cartão", "Dinheiro", "Consignação", "Doação", "Direitos autorais", "Divulgação"],
};
// Sócios que pagam despesas (o Painel soma por pessoa). "Adaulto" veio assim da planilha antiga.
const SOCIOS = ["Marcelo", "Adauto"];
const pagoPor = r => { const n = String(r.responsavel || "").trim(), k = n.toLowerCase(); return k.startsWith("marcel") ? "Marcelo" : (k === "adauto" || k === "adaulto") ? "Adauto" : n || "Sem responsável"; };
// Probabilidade padrão por etapa do funil (referência genérica; ajuste à realidade da editora)
const FUNIL = [["Lead", .10], ["Contato feito", .20], ["Amostra enviada", .35], ["Proposta", .50], ["Negociação", .75], ["Fechado - ganho", 1], ["Fechado - perdido", 0]];
const PROB = Object.fromEntries(FUNIL);
const COLS = ["titulos", "autores", "producao", "contatos", "oportunidades", "interacoes", "vendas", "financeiro"];
const D = Object.fromEntries(COLS.map(c => [c, []]));
const loaded = new Set();
const db = true, dbState = "on";
let ME = null, EQUIPE = [], PLAN_URL = null, carregado = false, erroAcesso = "", isOwner = false;
let AUD = [], audLoaded = false, audQ = "", audWho = "";
const pode = (c, n = "editar") => !!ME && (n === "editar" ? ME.perm[c] === "editar" : !!ME.perm[c] && ME.perm[c] !== "nenhum");
const api = (fn, ...a) => new Promise((ok, err) => google.script.run.withSuccessHandler(ok).withFailureHandler(err)[fn](...a));
function aplicar(r) {
  ME = r.usuario; isOwner = !!ME.admin; EQUIPE = r.equipe || []; PLAN_URL = r.planilhaUrl;
  for (const c of COLS) { D[c] = r.dados[c] || []; loaded.add(c); }
  carregado = true;
  $("#who").textContent = `Conectado como ${ME.email} · ${ME.perfil || "Colaborador"}`;
}

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = new Intl.NumberFormat("pt-BR");
const cf = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const num = v => { if (typeof v === "number") return isFinite(v) ? v : 0; const t = String(v ?? "").trim(); const n = /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : parseFloat(t.replace(/\./g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
const brl = v => cf.format(num(v));
const pct = v => (v === "" || v == null || !isFinite(v)) ? "—" : (v * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%";
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const dt = s => s ? s.split("-").reverse().join("/") : "—";
const days = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const sum = (arr, f) => arr.reduce((s, x) => s + num(f(x)), 0);
const by = (col, k, v) => D[col].find(r => r[k] === v);
const toast = msg => { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); };

// ---------- Cálculos ----------
const tituloDe = isbn => by("titulos", "isbn", isbn);
const contato = id => D.contatos.find(c => c.id === id);
const isVenda = v => v.tipo === "Venda" || v.tipo === "Acerto de consignação" || !v.tipo;
const SEM_VENDA = ["Doação", "Divulgação", "Direitos autorais"];
const qtd = (isbn, tipos) => sum(D.vendas.filter(v => v.isbn === isbn && tipos.includes(v.tipo || "Venda")), v => v.quantidade);
const vendaCapa = v => num(v.quantidade) * num(tituloDe(v.isbn)?.preco);
const vendaReceita = v => isVenda(v) ? num(v.valor) : 0;
const vendidos = isbn => qtd(isbn, ["Venda", "Acerto de consignação"]);
const consignado = isbn => qtd(isbn, ["Consignação"]) - qtd(isbn, ["Acerto de consignação", "Devolução de consignação"]);
const semVenda = isbn => qtd(isbn, SEM_VENDA);

// ---------- Filtros ----------
let F = {};

const PER = [["", "Todo o período"], ["mes", "Este mês"], ["mesant", "Mês passado"], ["30d", "Últimos 30 dias"], ["ano", "Este ano"], ["anoant", "Ano passado"], ["pers", "Personalizado…"]];
function intervalo(st) {

  switch (st?.per) {

    case "mesant": { const yy = m === 1 ? y - 1 : y, mm = m === 1 ? 12 : m - 1; return [`${yy}-${p2(mm)}-01`, `${yy}-${p2(mm)}-31`]; }

const filtrosAtivos = scope => Object.entries(F[scope] || {}).some(([k, v]) => v && k !== "de" && k !== "ate");

// ---------- Navegação ----------

function go(v) { view = v; q = ""; try { localStorage.setItem("le-view", v); } catch (e) {} render(); window.scrollTo(0, 0); }

// ---------- Renderização ----------
function render() {
  renderNav();
  const v = $("#view");
  if (erroAcesso) { v.innerHTML = semAcesso(); return; }
  if (!carregado) { v.innerHTML = `<div class="blank">Carregando a Linha Editora…</div>`; return; }
  if ((view === "auditoria" || view === "equipe") && !isOwner) view = "painel";

  const banner = COLS.includes(view) && !pode(view) ? `<div class="banner">Você pode ver esta área, mas não editar. Fale com o administrador para mudar seu acesso.</div>` : "";

function header(title, sub, actions = "") {

}
function tools(c) {

}
const filt = c => { const t = q.trim().toLowerCase(); const rows = t ? D[c].filter(r => S[c].text(r).toLowerCase().includes(t)) : D[c]; return aplicaFiltros(FILTROS[c], F[c] || {}, rows); };

function blank(c) {

  return `<div class="blank"><b>${S[c].fem ? "Nenhuma" : "Nenhum"} ${S[c].one} ainda</b><span>${q || filtrosAtivos(c) ? "Nada corresponde à busca ou aos filtros." : "Use o botão “" + (S[c].fem ? "Nova " : "Novo ") + S[c].one + "” para cadastrar " + (S[c].fem ? "a primeira." : "o primeiro.")}</span></div>`;
}

function table(c) {

    `</tbody></table></div><div class="tfoot"><span>${rows.length} ${rows.length === 1 ? "registro" : "registros"}</span><span>${s.foot ? s.foot(rows) : ""}</span></div>` : blank(c);

    `</tbody></table></div><div class="tfoot"><span>${EQUIPE.length} ${EQUIPE.length === 1 ? "pessoa cadastrada" : "pessoas cadastradas"}</span><span>Para tirar o acesso de alguém na hora, marque Ativo: Não ou remova.</span></div>`;
}
function semAcesso() {
  const m = erroAcesso.match(/SEM_ACESSO:(\S+)/);
  return `<div class="blank" style="padding-top:80px"><b>${m ? "Seu e-mail ainda não tem acesso" : "Não foi possível abrir a Linha Editora"}</b><span>${m ? `Você entrou como ${esc(m[1])}. Peça ao administrador (itamar@linhaeditora.com.br) para cadastrar seu e-mail em Equipe e acessos.` : "Confira se você está conectado com o e-mail da Linha Editora e recarregue a página."}</span></div>`;
}


function kpi(l, v, h, cls = "") { return `<div class="kpi"><span class="l">${l}</span><span class="v ${cls}">${v}</span><span class="h">${h}</span></div>`; }
function bars(items) {
  const max = Math.max(1, ...items.map(i => i[1]));
  return `<div class="bars">${items.map(([l, v]) => `<div class="bar"><span>${esc(l)}</span><div class="track"><div class="fill" style="width:${(v / max * 100).toFixed(1)}%"></div></div><span class="amt">${brl(v)}</span></div>`).join("")}</div>`;
}

function painel() {
  const ivP = intervalo(F.painel), noPer = ivP ? " no período" : "";
  const vendP = D.vendas.filter(v => dentro(v.data, ivP)), finP = D.financeiro.filter(r => dentro(r.data, ivP));
  const receita = sum(vendP, vendaReceita);
  const rec = sum(finP.filter(r => r.tipo === "Receita"), r => r.valor), des = sum(finP.filter(r => r.tipo === "Despesa"), r => r.valor);
  const fisico = sum(D.titulos.filter(t => t.tiragem), t => estoque(t.isbn));
  const consig = consigPorCliente();
  const aberto = D.oportunidades.filter(o => !(o.etapa || "").startsWith("Fechado"));
  const atrasadas = D.producao.filter(p => atrasoProd(p) > 0 && p.status !== "Concluído");
  const royal = sum(D.autores, saldoAutor);
  const tudoVazio = COLS.every(c => loaded.has(c) && D[c].length === 0);
  const temEx = COLS.some(c => D[c].some(r => r.exemplo));
  const acoes = aberto.filter(o => o.dataAcao).sort((a, b) => a.dataAcao.localeCompare(b.dataAcao)).slice(0, 6);
  const canais = L.canal.map(ch => [ch, sum(vendP.filter(v => v.canal === ch), vendaReceita)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  const funil = FUNIL.slice(0, 5).map(([e]) => [e, sum(aberto.filter(o => o.etapa === e), o => o.valor)]);
  const lanc = D.titulos.filter(t => t.lancamento && t.lancamento >= today()).sort((a, b) => a.lancamento.localeCompare(b.lancamento)).slice(0, 5);

  let html = header("Painel", "Visão geral da Linha Editora. Tudo aqui é calculado a partir das outras áreas.",
    isOwner && PLAN_URL ? `<a class="btn" href="${esc(PLAN_URL)}" target="_blank" rel="noopener">Abrir planilha</a>` : "");
  html += barraFiltros("painel", [{ k: "per", t: "per" }]);
  if (ivP) html += `<p class="sub" style="margin:-8px 0 0">Vendas, caixa e despesas mostram só o período escolhido. Estoque e consignações mostram sempre a posição de hoje.</p>`;
  if (false) html += `<div class="panel"><h2>Comece por aqui</h2><p class="sub" style="margin:0">O espaço está vazio. Cadastre seus títulos no Catálogo, ou carregue alguns registros de exemplo para ver como as áreas se ligam. Os exemplos ficam marcados e podem ser removidos com um clique.</p><div class="tools"><button class="btn primary" id="seed">Carregar exemplos</button><button class="btn" data-go2="titulos">Ir para o Catálogo</button></div></div>`;
  html += `<div class="kpis">
    ${kpi("Títulos", D.titulos.length, `${D.titulos.filter(t => t.status === "Publicado").length} publicados · ${D.titulos.filter(t => ["Em produção", "Pré-venda"].includes(t.status)).length} a caminho`)}
    ${kpi("Exemplares na editora", nf.format(fisico), `${nf.format(sum(D.titulos, t => vendidos(t.isbn)))} vendidos · ${nf.format(sum(D.titulos, t => semVenda(t.isbn)))} doados/autor`)}
    ${kpi("Em consignação", nf.format(sum(consig, c => c[1].q)) + " ex.", `em ${consig.length} livraria${consig.length === 1 ? "" : "s"} · ${brl(sum(consig, c => c[1].capa))} a preço de capa`)}
    ${kpi("Receita de vendas", brl(receita), `vendas diretas e acertos de consignação${noPer}`)}
    ${!pode("financeiro", "ver") ? "" : kpi("Resultado do caixa", brl(rec - des), `${brl(rec)} entradas · ${brl(des)} saídas${noPer}`, rec - des < 0 ? "bad" : rec - des > 0 ? "good" : "")}
    ${kpi("Pipeline ponderado", brl(sum(aberto, o => num(o.valor) * (PROB[o.etapa] ?? 0))), `${aberto.length} oportunidades abertas`)}
    ${kpi("Etapas atrasadas", atrasadas.length, "na produção editorial", atrasadas.length ? "bad" : "")}
    ${kpi("Contatos ativos", D.contatos.filter(c => c.ativo !== "Não").length, `${D.interacoes.length} interações registradas`)}
  </div>`;
  if (pode("financeiro", "ver")) {
    const desp = finP.filter(r => r.tipo === "Despesa");
    const grupos = [...SOCIOS, ...[...new Set(desp.map(pagoPor))].filter(n => !SOCIOS.includes(n)).sort()];
    const total = sum(desp, r => r.valor);
    const mes = today().slice(0, 7);
    html += `<div class="panel"><h2>Despesas por sócio${ivP ? " no período" : ""}</h2><div class="socios">${grupos.map(n => { const rs = desp.filter(r => pagoPor(r) === n), v = sum(rs, r => r.valor), vm = sum(rs.filter(r => (r.data || "").startsWith(mes)), r => r.valor);
      return `<div class="socio${SOCIOS.includes(n) ? "" : " outro"}"><span class="l">${esc(n)}</span><span class="v">${brl(v)}</span><div class="track"><div class="fill" style="width:${total ? (v / total * 100).toFixed(1) : 0}%"></div></div><span class="h">${total ? pct(v / total) : "—"} do total · ${rs.length} ${rs.length === 1 ? "lançamento" : "lançamentos"} · este mês ${brl(vm)}</span></div>`; }).join("")}</div>
      <div class="tfoot"><span>Total de despesas${noPer}: ${brl(total)}</span><button class="btn small" data-go2="financeiro">Ver lançamentos</button></div></div>`;
  }
  html += `<div class="grid2">
    <div class="panel"><h2>Próximas ações do CRM</h2><div class="list">${acoes.length ? acoes.map(o => { const [st, cl] = situacaoOp(o); return `<div class="it" data-edit="oportunidades" data-id="${esc(o.id)}" style="cursor:pointer"><div class="t"><b>${esc(o.proximaAcao || o.oportunidade)}</b><div>${esc(contato(o.contatoId)?.nome || "")} · ${dt(o.dataAcao)}</div></div><span class="chip ${cl}">${st}</span></div>`; }).join("") : `<div class="empty">Nenhuma ação agendada no funil.</div>`}</div></div>
    <div class="panel"><h2>Produção atrasada</h2><div class="list">${atrasadas.length ? atrasadas.slice(0, 6).map(p => `<div class="it" data-edit="producao" data-id="${esc(p.id)}" style="cursor:pointer"><div class="t"><b>${esc(p.titulo)}</b><div>${esc(p.etapa)} · prazo ${dt(p.prazo)}${p.responsavel ? " · " + esc(p.responsavel) : ""}</div></div><span class="chip bad">${atrasoProd(p)} dias</span></div>`).join("") : `<div class="empty">Nenhuma etapa atrasada.</div>`}</div></div>
    <div class="panel"><h2>Receita por canal${noPer}</h2>${canais.length ? bars(canais) : `<div class="empty">Sem vendas registradas.</div>`}</div>
    <div class="panel"><h2>Funil de vendas por etapa</h2>${aberto.length ? bars(funil) : `<div class="empty">Sem oportunidades abertas.</div>`}</div>
    <div class="panel"><h2>Consignações em aberto</h2><div class="list">${consig.length ? consig.map(([k, x]) => `<div class="it"><div class="t"><b>${esc(k)}</b><div>${brl(x.capa)} a preço de capa</div></div><span class="chip acc">${nf.format(x.q)} ex.</span></div>`).join("") : `<div class="empty">Nenhum exemplar em consignação.</div>`}</div></div>
    <div class="panel"><h2>Estoque por título</h2><div class="list">${D.titulos.length ? D.titulos.map(t => `<div class="it" data-edit="titulos" data-id="${esc(t.id)}" style="cursor:pointer"><div class="t"><b>${esc(t.titulo)}</b><div>tiragem ${nf.format(num(t.tiragem))} · consignado ${nf.format(consignado(t.isbn))} · vendido ${nf.format(vendidos(t.isbn))} · doado/autor ${nf.format(semVenda(t.isbn))}</div></div><span class="chip ${estoque(t.isbn) < 50 ? "bad" : ""}">${nf.format(estoque(t.isbn))} na editora</span></div>`).join("") : `<div class="empty">Nenhum título cadastrado.</div>`}</div></div>
    <div class="panel"><h2>Próximos lançamentos</h2><div class="list">${lanc.length ? lanc.map(t => `<div class="it" data-edit="titulos" data-id="${esc(t.id)}" style="cursor:pointer"><div class="t"><b>${esc(t.titulo)}</b><div>${esc(t.autor || "")} · ${esc(t.formato || "")}</div></div><span class="chip acc">${dt(t.lancamento)}</span></div>`).join("") : `<div class="empty">Nenhum lançamento com data futura.</div>`}</div></div>
    <div class="panel"><h2>Royalties por autor</h2><div class="list">${D.autores.length ? D.autores.slice().sort((a, b) => saldoAutor(b) - saldoAutor(a)).slice(0, 6).map(a => `<div class="it"><div class="t"><b>${esc(a.nome)}</b><div>gerado ${brl(royaltiesGerados(a))} · adiantamento ${brl(a.adiantamento)}</div></div><span class="mono">${brl(saldoAutor(a))}</span></div>`).join("") : `<div class="empty">Nenhum autor cadastrado.</div>`}</div></div>
  </div>`;
  return html;
}

// ---------- Eventos da área de conteúdo ----------
$("#view").addEventListener("input", e => {
  if (e.target.id === "audQ") { audQ = e.target.value; const pos = e.target.selectionStart; render(); const s = $("#audQ"); s.focus(); s.setSelectionRange(pos, pos); return; }
  if (e.target.id === "q") { q = e.target.value; const pos = e.target.selectionStart; render(); const s = $("#q"); s.focus(); s.setSelectionRange(pos, pos); }
});
$("#view").addEventListener("change", async e => {
  if (e.target.id === "audWho") { audWho = e.target.value; return render(); }
  const fe = e.target.closest("[data-f]");
  if (fe) { const sc = fe.closest("[data-scope]").dataset.scope; F[sc] = F[sc] || {}; F[sc][fe.dataset.f] = fe.type === "checkbox" ? fe.checked : fe.value; salvarF(); return render(); }
  const sel = e.target.closest("[data-stage]"); if (!sel) return;
  try { aplicar(await api("salvar", "oportunidades", { id: sel.dataset.stage, etapa: sel.value })); render(); toast(`Movido para ${sel.value}`); }
  catch (err) { failed(err); }
});
$("#view").addEventListener("click", e => {
  if (e.target.closest("select, input")) return;
  const n = e.target.closest("[data-new]"); if (n) return openForm(n.dataset.new);
  const ed = e.target.closest("[data-edit]"); if (ed) return openForm(ed.dataset.edit, ed.dataset.id);
  const g2 = e.target.closest("[data-go2]"); if (g2) return go(g2.dataset.go2);
  if (e.target.id === "audRefresh") return carregarRegistro();
  const lf = e.target.closest("[data-limpar]"); if (lf) { F[lf.dataset.limpar] = {}; salvarF(); return render(); }
  const sm = e.target.closest("[data-salvar-membro]"); if (sm) return salvarMembroUI(sm.closest("tr"), sm);
  const rm = e.target.closest("[data-remover-membro]"); if (rm) return removerMembroUI(rm.closest("tr"), rm);
});
$("#view").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("[data-edit]")) openForm(e.target.dataset.edit, e.target.dataset.id); });

// ---------- Formulário ----------
let editing = null;
function input(f, val) {
  const id = "f-" + f.k, v = val ?? (f.def ? f.def() : "");
  const req = f.req ? " required" : "";
  if (f.t === "sel" || f.t === "ref") {
    const opts = f.t === "sel" ? f.o.map(o => [o, o]) : refOpts[f.ref]();
    if (v && !opts.some(o => o[0] === v)) opts.unshift([v, v]);
    return `<select id="${id}" name="${f.k}"${req}><option value="">—</option>${opts.map(([a, b]) => `<option value="${esc(a)}" ${a === v ? "selected" : ""}>${esc(b)}</option>`).join("")}</select>`;
  }
  if (f.t === "list") return `<input id="${id}" name="${f.k}" list="dl-${f.k}" value="${esc(v)}"><datalist id="dl-${f.k}">${refOpts[f.ref]().map(([a]) => `<option value="${esc(a)}"></option>`).join("")}</datalist>`;
  if (f.t === "area") return `<textarea id="${id}" name="${f.k}">${esc(v)}</textarea>`;
  const type = f.t === "date" ? "date" : f.t === "email" ? "email" : ["money", "int", "num"].includes(f.t) ? "number" : "text";
  const step = f.t === "money" ? ' step="0.01" min="0"' : f.t === "int" ? ' step="1" min="0"' : f.t === "num" ? ' step="0.1" min="0"' : "";
  return `<input id="${id}" name="${f.k}" type="${type}"${step}${req} value="${esc(v)}" ${f.mono ? 'class="mono"' : ""}>`;
}
function openForm(c, id) {
  if (!db && !id) return;
  const s = S[c], r = id ? D[c].find(x => x.id === id) : null;
  if (id && !r) return;
  editing = { c, id };
  const ro = !pode(c);
  $("#frm").innerHTML = `<div class="dh"><h2>${r ? (ro ? "" : "Editar ") + s.one : (s.fem ? "Nova " : "Novo ") + s.one}</h2><button type="button" class="x" id="close" aria-label="Fechar">×</button></div>
    <fieldset class="db" style="border:0;margin:0" ${ro ? "disabled" : ""}>${s.fields.map(f => f.sec ? `<h3 class="sec">${f.sec}</h3>` : `<div class="f ${f.full ? "full" : ""}"><label for="f-${f.k}">${f.l}${f.req ? " *" : ""}</label>${input(f, r?.[f.k])}${f.hint ? `<span class="hint">${f.hint}</span>` : ""}</div>`).join("")}<div class="err" id="ferr"></div></fieldset>
    <div class="df">${r && !ro && ME?.podeExcluir ? `<button type="button" class="btn danger" id="del">Excluir</button>` : ""}<div class="r"><button type="button" class="btn" id="cancel">${ro ? "Fechar" : "Cancelar"}</button>${ro ? "" : `<button type="submit" class="btn primary">Salvar</button>`}</div></div>`;
  $("#dlg").showModal();
}
$("#frm").addEventListener("click", async e => {
  if (e.target.id === "close" || e.target.id === "cancel") return $("#dlg").close();
  if (e.target.id === "del") {
    const b = e.target;
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmar exclusão"; return; }
    try { aplicar(await api("excluir", editing.c, editing.id)); $("#dlg").close(); toast("Excluído"); } catch (err) { failed(err); }
  }
});
$("#frm").addEventListener("submit", async e => {
  e.preventDefault();
  const { c, id } = editing, s = S[c], fd = new FormData(e.target), body = {};
  const flds = s.fields.filter(f => f.k);
  const missing = flds.filter(f => f.req && !String(fd.get(f.k) ?? "").trim());
  if (missing.length) { $("#ferr").textContent = "Preencha: " + missing.map(f => f.l).join(", ") + "."; return; }
  for (const f of flds) {
    let v = String(fd.get(f.k) ?? "").trim();
    body[f.k] = ["money", "int", "num"].includes(f.t) ? (v === "" ? "" : num(v)) : v;
  }
  if (c === "titulos" && D.titulos.some(t => t.isbn === body.isbn && t.id !== id)) { $("#ferr").textContent = "Já existe um título com esse ISBN."; return; }
  const btn = e.target.querySelector('[type="submit"]');
  if (body.data && btn.dataset.ok !== body.data) {
    const dd = days(body.data, today());
    const aviso = dd < 0 ? `A data ${dt(body.data)} está no futuro.` : dd > 365 ? `A data ${dt(body.data)} é de mais de um ano atrás.` : "";
    if (aviso) { $("#ferr").textContent = aviso + " Se estiver certa, clique em Salvar de novo."; btn.dataset.ok = body.data; return; }
  }
  btn.disabled = true; btn.textContent = "Salvando…";
  try {
    aplicar(await api("salvar", c, id ? { ...body, id } : body));
    $("#dlg").close(); toast(id ? "Alterações salvas" : `${s.one[0].toUpperCase() + s.one.slice(1)} ${s.fem ? "cadastrada" : "cadastrado"}`);
  } catch (err) { btn.disabled = false; btn.textContent = "Salvar"; failed(err, $("#ferr")); }
});
function failed(err, where) {
  const m = String(err?.message || err || "");
  const msg = m.includes("VALIDACAO:") ? m.slice(m.indexOf("VALIDACAO:") + 10).split("|").join(" · ") + "."
    : m.includes("SEM_PERMISSAO_EXCLUIR") ? "Só administradores podem excluir. Fale com o Itamar."
    : m.includes("SEM_PERMISSAO") ? "Seu acesso não permite fazer isso. Fale com o administrador."
    : m.includes("ISBN_DUPLICADO") ? "Já existe um título com esse ISBN."
    : m.includes("SEM_ACESSO") ? "Seu e-mail não tem mais acesso. Recarregue a página."
    : m.includes("EMAIL_INVALIDO") ? "Confira o e-mail: ele parece incompleto."
    : m.includes("E_ADMIN") ? "Esse é o e-mail do administrador, que já tem acesso total."
    : "Não foi possível salvar agora. Confira a conexão e tente de novo.";
  where ? (where.textContent = msg) : toast(msg);
}
async function salvarMembroUI(tr, btn) {
  const m = { email: tr.dataset.membro };
  tr.querySelectorAll("[data-m]").forEach(el => m[el.dataset.m] = el.value.trim());
  if (!m.email) return toast("Informe o e-mail da pessoa.");
  btn.disabled = true; btn.textContent = "Salvando…";
  try { aplicar(await api("salvarMembro", m)); render(); toast("Acesso salvo"); } catch (e) { btn.disabled = false; btn.textContent = "Salvar"; failed(e); }
}
async function removerMembroUI(tr, btn) {
  if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "Confirmar"; return; }
  btn.disabled = true;
  try { aplicar(await api("removerMembro", tr.dataset.membro)); render(); toast("Pessoa removida"); } catch (e) { btn.disabled = false; failed(e); }
}

// ---------- Dados ----------
render();
api("carregar").then(r => { aplicar(r); render(); }).catch(e => { erroAcesso = String(e?.message || e); render(); });
// Traz as mudanças da equipe a cada minuto, sem atrapalhar quem está digitando
setInterval(() => {
  if (!carregado || document.hidden || $("#dlg").open || document.activeElement?.matches?.("input, select, textarea")) return;
  api("atualizar").then(r => { aplicar(r); render(); }).catch(() => {});
}, 60000);
$("#dlg").addEventListener("close", () => render());
</script>
</body>
</html>
